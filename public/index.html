<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat App</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="chat.css"></link>
</head>
<body>
    <div id="nav-placeholder"></div>

    <script>
        fetch('/navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Error loading navbar:', error));
    </script>
    
    <h2>Welcome to the Chat</h2>
    <button onclick="logout()">Logout</button>
    <div id="chatBox"></div>
    <textarea id="message" placeholder="Type a message..."></textarea>
    <button id="sendMessage">Send</button>

    <script>
        
    </script>

    <script>
        const socket = io();
        let token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "/login";
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "/login";
        }

        let lastMessageId = 0;

    async function loadMessages() {
        try {
            const response = await fetch('/messages?afterId=' + lastMessageId);

            if (!response.ok) {
                throw new Error(`Failed to fetch messages: ${response.statusText}`);
            }

            const messages = await response.json();
            const chatBox = document.getElementById('chatBox');

            messages.forEach(message => {
                chatBox.innerHTML += `<div><strong>${message.sender}:</strong> ${message.content}</div>`;
                lastMessageId = message.id;
            });

            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(loadMessages, 1000);
        } catch (error) {
            console.error("Error loading messages:", error);
        }
    }

        document.getElementById('sendMessage').addEventListener('click', async () => {
            const content = document.getElementById('message').value;
            if (!content.trim()) return alert("Message cannot be empty!");

            const messageData = {
                token: localStorage.getItem("token"),
                content
            };

            try {
                const response = await fetch('/sendMessage', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${messageData.token}`
                    },
                    body: JSON.stringify({ token: messageData.token, content: messageData.content })
                });

                if (!response.ok) {
                    throw new Error(`Failed to send message: ${response.statusText}`);
                }

                document.getElementById('message').value = '';
                loadMessages();
            } catch (error) {
                console.error("Error sending message:", error);
                alert("Error sending message");
            }
        });

        loadMessages();
    </script>
</body>
</html>
