<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat App</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="chat.css"></link>
</head>
<body>
    <div id="nav-placeholder"></div>
    <script>
        fetch('/navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Error loading navbar:', error));
    </script>

    <div class="container">
        <div class="chat-header">
            <h2>💬 Welcome to the Chat</h2>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        <div id="chatBox" class="chat-box"></div>
        <div class="input-row">
            <textarea id="message" class="chat-input" placeholder="Type a message..."></textarea>
            <button id="sendMessage" class="send-btn">Send</button>
        </div>
    </div>
    <style>
        body {
            background: #f4f6fb;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 0 0 20px 0;
        }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #4f8cff;
            color: #fff;
            border-radius: 12px 12px 0 0;
            padding: 18px 24px;
        }
        .logout-btn {
            background: #fff;
            color: #4f8cff;
            border: none;
            border-radius: 6px;
            padding: 8px 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: #e3eaff;
        }
        .chat-box {
            min-height: 320px;
            max-height: 400px;
            overflow-y: auto;
            padding: 18px 24px;
            background: #f9fbff;
            border-bottom: 1px solid #e3eaff;
        }
        .chat-input {
            width: 100%;
            min-height: 40px;
            max-height: 80px;
            resize: vertical;
            border-radius: 8px;
            border: 1px solid #c7d7ff;
            padding: 10px;
            font-size: 1rem;
            margin-right: 10px;
            box-sizing: border-box;
        }
        .input-row {
            display: flex;
            gap: 10px;
            padding: 16px 24px 0 24px;
        }
        .send-btn {
            background: #4f8cff;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 22px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .send-btn:hover {
            background: #2563eb;
        }
        #chatBox div {
            margin-bottom: 10px;
            padding: 8px 12px;
            background: #e3eaff;
            border-radius: 8px;
            max-width: 80%;
            word-break: break-word;
        }
        #chatBox div strong {
            color: #2563eb;
        }
    </style>

    <script>
        
    </script>

    <script>
        const socket = io();
        let token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "/login";
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "/login";
        }

        let lastMessageId = 0;

    async function loadMessages() {
        try {
            const response = await fetch('/messages?afterId=' + lastMessageId);

            if (!response.ok) {
                throw new Error(`Failed to fetch messages: ${response.statusText}`);
            }

            const messages = await response.json();
            const chatBox = document.getElementById('chatBox');

            messages.forEach(message => {
                chatBox.innerHTML += `<div><strong>${message.sender}:</strong> ${message.content}</div>`;
                lastMessageId = message.id;
            });

            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(loadMessages, 1000);
        } catch (error) {
            console.error("Error loading messages:", error);
        }
    }

        document.getElementById('sendMessage').addEventListener('click', async () => {
            const content = document.getElementById('message').value;
            if (!content.trim()) return alert("Message cannot be empty!");

            const messageData = {
                token: localStorage.getItem("token"),
                content
            };

            try {
                const response = await fetch('/sendMessage', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${messageData.token}`
                    },
                    body: JSON.stringify({ token: messageData.token, content: messageData.content })
                });

                if (!response.ok) {
                    throw new Error(`Failed to send message: ${response.statusText}`);
                }

                document.getElementById('message').value = '';
                loadMessages();
            } catch (error) {
                console.error("Error sending message:", error);
                alert("Error sending message");
            }
        });

        loadMessages();
    </script>
</body>
</html>
