<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat App</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="chat.css"></link>
</head>
<body>
    <div id="nav-placeholder"></div>
    <script>
        fetch('/navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Error loading navbar:', error));
    </script>

    <div class="container">
        <div class="chat-header">
            <h2>💬 Welcome to the Chat</h2>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        <div id="chatBox" class="chat-box"></div>
        <div class="input-row">
            <textarea id="message" class="chat-input" placeholder="Type a message..."></textarea>
            <button id="sendMessage" class="send-btn">Send</button>
        </div>
    </div>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            background: #181c24;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            height: 100vh;
            width: 100vw;
        }
        .container {
            height: 100vh;
            width: 100vw;
            max-width: none;
            margin: 0;
            background: #23283a;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
        }
        .logout-btn {
            background: #2d3347;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: #3a405a;
        }
        .chat-box {
            flex: 1 1 auto;
            min-height: 0;
            max-height: none;
            overflow-y: auto;
            padding: 24px 32px;
            background: #181c24;
            border-bottom: 1px solid #2d3347;
        }
            #chatBox div {
                margin-bottom: 10px;
                padding: 10px 16px;
                background: #2d3347;
                color: #fff;
                border-radius: 8px;
                max-width: 80%;
                word-break: break-word;
            }
            #chatBox div strong {
                color: #b0b3c2;
            }
            box-sizing: border-box;
        /* removed stray closing bracket */
        .chat-input::placeholder {
            color: #7a819a;
        }
        .input-row {
            display: flex;
            gap: 10px;
            padding: 20px 32px 20px 32px;
            background: #23283a;
        }
        .send-btn {
            background: #444857;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 22px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .send-btn:hover {
            background: #5a5e6e;
        }
    </style>

    <script>
        const socket = io();
        let token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "/login";
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "/login";
        }

        let lastMessageId = 0;

        async function loadMessages() {
            try {
                const response = await fetch('/messages?afterId=' + lastMessageId);

                if (!response.ok) {
                    throw new Error(`Failed to fetch messages: ${response.statusText}`);
                }

                const messages = await response.json();
                const chatBox = document.getElementById('chatBox');

                messages.forEach(message => {
                    chatBox.innerHTML += `<div><strong>${message.sender}:</strong> ${message.content}</div>`;
                    lastMessageId = message.id;
                });

                chatBox.scrollTop = chatBox.scrollHeight;

                setTimeout(loadMessages, 1000);
            } catch (error) {
                window.location.href = "/login";
            }
        }

        document.getElementById('sendMessage').addEventListener('click', async () => {
            const content = document.getElementById('message').value;
            if (!content.trim()) return alert("Message cannot be empty!");

            const messageData = {
                token: localStorage.getItem("token"),
                content
            };

            try {
                const response = await fetch('/sendMessage', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${messageData.token}`
                    },
                    body: JSON.stringify({ token: messageData.token, content: messageData.content })
                });

                if (!response.ok) {
                    throw new Error(`Failed to send message: ${response.statusText}`);
                }

                document.getElementById('message').value = '';
                loadMessages();
            } catch (error) {
                console.error("Error sending message:", error);
                alert("Error sending message");
            }
        });

        loadMessages();
    </script>
</body>
</html>
